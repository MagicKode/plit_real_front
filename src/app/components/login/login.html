<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Вход для мастера</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Логин</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-yellow-500"
          placeholder="admin"
          required>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Пароль</label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-yellow-500 pr-10"
            placeholder="••••••"
            required>

          <!-- Кнопка "глаз" -->
          <button
            type="button"
            (click)="togglePassword()"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700">

            @if (showPassword) {
              <!-- Иконка "перечеркнутый глаз" (скрыть) -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            } @else {
              <!-- Иконка "глаз" (показать) -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            }
          </button>
        </div>
      </div>

      @if (error) {
        <div class="mb-4 text-red-500 text-sm">{{ error }}</div>
      }

      <button
        type="submit"
        class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 rounded transition">
        Войти
      </button>
    </form>
  </div>
</div>
