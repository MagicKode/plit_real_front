<section class="py-20 bg-gray-900/90 text-white relative">
  <!-- Кнопка редактирования -->
  @if (authService.isLoggedIn()) {
    <button (click)="editContacts()" class="absolute top-4 right-4 bg-yellow-500 hover:bg-yellow-600 text-black font-bold px-3 py-1 rounded text-sm transition z-10">
      ✎ Редактировать
    </button>
  }

  <div class="container mx-auto px-4 text-center">
    <h2 class="text-3xl md:text-4xl font-bold mb-8">Свяжитесь со мной</h2>

    <p class="text-xl text-gray-300 mb-4">Работаю: {{ address }}</p>

    <a [href]="'tel:' + cleanPhone" class="text-3xl md:text-5xl font-bold text-yellow-500 hover:text-yellow-400 transition block mb-8">
      {{ phone }}
    </a>

    <div class="flex justify-center gap-4 mb-12">
      <a [href]="viber" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-full transition">
        Viber
      </a>
      <a [href]="telegram" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-full transition">
        Telegram
      </a>
    </div>

    <div class="text-gray-500 text-sm mt-4">
      <p>ИП Иванов А.А. УНП 123456789</p>
      <p>&copy; 2026 PLITreal. Все права защищены.
        <button (click)="authService.openLoginModal()" class="text-gray-600 hover:text-gray-400 text-xs ml-2 underline">
          Вход для мастера
        </button>
      </p>
    </div>
  </div>

  <!-- Модалка редактирования -->
  @if (isEditModalOpen) {
    <app-contacts-edit-modal
      [phone]="phone"
      [telegram]="telegram"
      [viber]="viber"
      [address]="address"
      (save)="onSaveContacts($event)"
      (close)="onCloseContactsModal()">
    </app-contacts-edit-modal>
  }
</section>
