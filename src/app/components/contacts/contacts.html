<section class="py-20 bg-gray-900/90 text-white">

    <h2 class="text-3xl md:text-4xl font-bold mb-8">Свяжитесь со мной</h2>

    <p class="text-xl text-gray-300 mb-4">Работаю: {{ address }}</p>

    <a href="tel:+375255009052" class="text-3xl md:text-5xl font-bold text-yellow-500 hover:text-yellow-400 transition block mb-8">
      {{ phone }}
    </a>

    <div class="flex justify-center gap-4 mb-12">
      <a [href]="viber" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-full transition">

      <a [href]="telegram" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-full transition">

      </a>

    <div class="text-gray-500 text-sm">
