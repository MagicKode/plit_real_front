<section class="py-20 bg-white/80">
  <div class="container mx-auto px-4 flex flex-col md:flex-row items-center gap-8">

    <!-- Фото мастера -->
    <div class="w-full md:w-1/3 flex justify-center">
      <img src="master.jpeg" alt="Мастер Александр" class="w-full max-w-xs md:max-w-sm h-auto rounded-lg shadow-lg object-cover">
    </div>

    <!-- Текст -->
    <div class="w-full md:w-1/2">
      <h2 class="text-3xl md:text-4xl font-bold mb-4 text-gray-800">
        О мастере: {{ masterName }}
      </h2>
      <p class="text-xl text-yellow-600 font-semibold mb-4">
        Опыт работы: {{ experience }}
      </p>
      <p class="text-gray-900 font-medium mb-6 leading-relaxed drop-shadow-sm">
        {{ description }}
      </p>
      <a href="tel:+375255009052" class="inline-block bg-yellow-500 hover:bg-yellow-600 text-black font-bold text-lg px-8 py-4 rounded-full transition shadow-lg transform hover:scale-105">
        📞 Позвонить
      </a>
    </div>

  </div>
</section>
