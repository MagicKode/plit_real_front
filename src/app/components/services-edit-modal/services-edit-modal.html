<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" (click)="onClose()">
  <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-3xl max-h-[90vh] overflow-y-auto" (click)="$event.stopPropagation()">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold text-gray-800">Редактировать услуги</h2>
      <button (click)="onClose()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
    </div>

    <!-- Список услуг -->
    <div class="space-y-4 mb-6">
      @for (service of editableServices; track service.id; let i = $index) {
        <div class="border p-4 rounded-lg bg-gray-50 relative">
          <button (click)="removeService(i)" class="absolute top-2 right-2 text-red-500 hover:text-red-700 text-xl font-bold">&times;</button>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-gray-700 text-sm mb-1">Иконка (эмодзи)</label>
              <input type="text" [(ngModel)]="service.icon" class="w-full p-2 border rounded text-center text-2xl" maxlength="2">
            </div>
            <div class="md:col-span-2">
              <label class="block text-gray-700 text-sm mb-1">Название</label>
              <input type="text" [(ngModel)]="service.title" class="w-full p-2 border rounded">
            </div>
          </div>

          <div class="mt-3">
            <label class="block text-gray-700 text-sm mb-1">Описание</label>
            <textarea [(ngModel)]="service.description" rows="2" class="w-full p-2 border rounded"></textarea>
          </div>
        </div>
      }
    </div>

    <!-- Кнопка добавить -->
    <button (click)="addService()" class="mb-6 bg-green-500 hover:bg-green-600 text-white font-bold px-4 py-2 rounded transition">
      + Добавить услугу
    </button>

    <!-- Кнопки -->
    <div class="flex justify-end gap-2">
      <button (click)="onClose()" class="px-4 py-2 border rounded hover:bg-gray-100">Отмена</button>
      <button (click)="onSave()" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-black font-bold rounded">Сохранить</button>
    </div>
  </div>
</div>
