<section class="py-20 bg-gray-100/80 relative">

  <!-- Кнопка редактирования (только для мастера) -->
  @if (authService.isLoggedIn()) {
    <button (click)="editServices()" class="absolute top-4 right-4 bg-yellow-500 hover:bg-yellow-600 text-black font-bold px-3 py-1 rounded text-sm transition z-10">
      ✎ Редактировать
    </button>
  }

  <div class="container mx-auto px-4">
    <h2 class="text-3xl md:text-4xl font-bold text-center mb-12 text-gray-800">
      Мои услуги
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (service of services; track service.title) {
        <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition">
          <div class="text-4xl mb-4">{{ service.icon }}</div>
          <h3 class="text-xl font-bold mb-2 text-gray-800">{{ service.title }}</h3>
          <p class="text-gray-600">{{ service.description }}</p>
        </div>
      }
    </div>
  </div>

  <!-- Модалка редактирования -->
  @if (isEditModalOpen) {
    <app-services-edit-modal
      [services]="services"
      (save)="onSaveServices($event)"
      (close)="onCloseServicesModal()">
    </app-services-edit-modal>
  }
</section>
