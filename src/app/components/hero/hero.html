<section
  class="relative bg-cover bg-center bg-fixed text-white"
  [style.background-image]="fullBackgroundStyle">

  <!-- Кнопка редактирования (только для мастера) -->
  @if (authService.isLoggedIn()) {
    <button (click)="editHero()"
            class="absolute top-4 right-4 bg-yellow-500 hover:bg-yellow-600 text-black font-bold px-3 py-1 rounded text-sm transition z-10">
      ✎ Редактировать
    </button>
  }

  <div class="container mx-auto px-4 py-32 md:py-48 flex flex-col items-center text-center">
    <h1 class="text-4xl md:text-6xl font-bold mb-4 drop-shadow-lg whitespace-pre-line">
      {{ title }}
    </h1>
    <p class="text-xl md:text-2xl text-gray-200 mb-8 max-w-2xl drop-shadow-md whitespace-pre-line">
      {{ subtitle }}
    </p>
    <a href="tel:+375255009052" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold text-xl px-8 py-4 rounded-full transition shadow-lg transform hover:scale-105">
      {{ buttonText }}
    </a>
  </div>

  @if (isEditModalOpen) {
    <app-hero-edit-modal
      [title]="title"
      [subtitle]="subtitle"
      [buttonText]="buttonText"
      [currentBackgroundUrl]="backgroundUrl"
      (save)="onSaveHero($event)"
      (close)="onCloseHeroModal()">
    </app-hero-edit-modal>
  }
</section>
