<header class="bg-gray-900 text-white shadow-md sticky top-0 z-40">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">

    <!-- Логотип + Название -->
    <div class="flex items-center gap-4 shrink-0">
      <img src="logo/logo.png" alt="PLITreal логотип" class="h-24 w-24 object-contain">
      <div class="flex flex-col">
        <span class="text-2xl font-bold text-yellow-500 leading-none tracking-wide">PLITreal.</span>
        <span class="text-[10px] text-gray-400 hidden lg:inline uppercase tracking-widest">профессионально в Минске</span>
      </div>
    </div>

    <!-- Меню (скрыто на мобилке, видно на десктопе) -->
    <nav class="hidden lg:flex gap-10 text-base font-medium">
      <button (click)="scrollTo('services')" class="hover:text-yellow-500 transition">Услуги</button>
      <button (click)="scrollTo('portfolio')" class="hover:text-yellow-500 transition">Работы</button>
      <button (click)="scrollTo('prices')" class="hover:text-yellow-500 transition">Цены</button>
      <button (click)="scrollTo('about')" class="hover:text-yellow-500 transition">О мастере</button>
      <button (click)="scrollTo('reviews')" class="hover:text-yellow-500 transition">Отзывы</button>
      <button (click)="scrollTo('contacts')" class="hover:text-yellow-500 transition">Контакты</button>
    </nav>
