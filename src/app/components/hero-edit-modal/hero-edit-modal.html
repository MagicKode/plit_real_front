<div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl max-w-lg w-full p-6 text-gray-900 shadow-2xl">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-bold">Редактировать главный экран</h3>
      <button (click)="onClose()" class="text-gray-500 hover:text-gray-800 text-2xl leading-none">&times;</button>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Главный заголовок</label>
        <textarea [(ngModel)]="title" rows="2"
                  class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-yellow-500 outline-none"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Подзаголовок</label>
        <textarea [(ngModel)]="subtitle" rows="3"
                  class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-yellow-500 outline-none"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Текст кнопки</label>
        <input type="text" [(ngModel)]="buttonText"
               class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-yellow-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Фоновое изображение</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*"
               class="w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-yellow-500 file:text-black file:font-semibold hover:file:bg-yellow-600">
        @if (uploading) {
          <p class="text-sm text-yellow-600 mt-1">Загрузка изображения...</p>
        }
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button (click)="onClose()"
              class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition">
        Отмена
      </button>
      <button (click)="onSave()" [disabled]="uploading"
              class="px-5 py-2 bg-yellow-500 hover:bg-yellow-600 text-black font-bold rounded-lg transition disabled:opacity-50">
        Сохранить
      </button>
    </div>
  </div>
</div>
