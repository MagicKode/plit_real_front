<section class="py-20 bg-white relative">
  <!-- Кнопка редактирования -->
  @if (authService.isLoggedIn()) {
    <button (click)="editPrices()" class="absolute top-4 right-4 bg-yellow-500 hover:bg-yellow-600 text-black font-bold px-3 py-1 rounded text-sm transition z-10">
      ✎ Редактировать
    </button>
  }

  <div class="container mx-auto px-4">
    <h2 class="text-3xl md:text-4xl font-bold text-center mb-12 text-gray-800">
      Расценки на услуги
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl mx-auto">
      @for (item of prices; track item.id ?? $index) {
        <div class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition flex justify-between items-center border border-gray-200 border-l-4 border-l-yellow-500">
          <!-- Наименование работы -->
          <span class="text-gray-900 font-semibold text-base">{{ item.service }}</span>

          <!-- Выделенный бейдж цены -->
          <span class="bg-yellow-500/15 text-gray-900 border border-yellow-500/40 px-3 py-1 rounded-md font-bold text-sm md:text-base whitespace-nowrap ml-4">
            {{ item.price }} {{ item.unit }}
          </span>
        </div>
      }
    </div>

    <p class="text-center text-gray-500 mt-8 text-sm">
      * Точная стоимость зависит от объема и сложности работ. Позвоните для бесплатной консультации.
    </p>
  </div>

  <!-- Модалка редактирования -->
  @if (isEditModalOpen) {
    <app-prices-edit-modal
      [prices]="prices"
      (save)="onSavePrices($event)"
      (close)="onClosePricesModal()">
    </app-prices-edit-modal>
  }
</section>
