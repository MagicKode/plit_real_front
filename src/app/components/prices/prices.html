<section class="py-20 bg-gray-50">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl md:text-4xl font-bold text-center mb-12 text-gray-800">
      Расценки на услуги
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl mx-auto">
      @for (item of prices; track item.service) {
        <div class="bg-white p-4 rounded-lg shadow-sm flex justify-between items-center border-l-4 border-yellow-500">
          <span class="text-gray-800 font-medium">{{ item.service }}</span>
          <span class="text-yellow-600 font-bold whitespace-nowrap ml-4">
            {{ item.price }} {{ item.unit }}
          </span>
        </div>
      }
    </div>

    <p class="text-center text-gray-500 mt-8 text-sm">
      * Точная стоимость зависит от объема и сложности работ. Позвоните для бесплатной консультации.
    </p>
  </div>
</section>
